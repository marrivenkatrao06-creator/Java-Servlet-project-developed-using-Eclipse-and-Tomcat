<%@ page language="java" contentType="text/html; charset=UTF-8"
    pageEncoding="UTF-8"%>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration Successful</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background-color: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 400px;
    }

    h2 {
        color: #28a745;
        margin-bottom: 20px;
    }

    h3 {
        color: #333;
        font-size: 22px;
    }

    .user-id {
        color: #007bff;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="container">
    <h2>Registration Successful</h2>

    <h3>
        Your ID is :
        <span class="user-id">
            <%= request.getAttribute("Id") %>
        </span>
           
    </h3>
   <button type="button"><a href="./Login.html">Login</a></button> 
</div>

</body>
</html>
